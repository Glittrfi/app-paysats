# PaySats Stacks MCP reverse proxy — stxmcp.paysats.exchange
#
# Separate from privymcp (paysats_v2 :3400, Base/Privy). This vhost proxies
# to pm2 paysats-stxmcp (app-paysats :3500).
#
# Install / update:
#   sudo cp deploy/nginx-stxmcp.paysats.exchange.conf /etc/nginx/sites-available/paysats-v2-stxmcp
#   sudo ln -sf /etc/nginx/sites-available/paysats-v2-stxmcp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# App:
#   pm2 start deploy/ecosystem-stxmcp.config.cjs
#   After git pull: npm run build && pm2 restart paysats-stxmcp
# Claude config:
#   { "mcpServers": { "paysats-stacks": { "url": "https://stxmcp.paysats.exchange/mcp" } } }
#
# Pass /mcp through unchanged. Next.js app/mcp/route.ts serves Stacks tools.
# Do not rewrite to /api/stxmcp/mcp — mcp-handler matches pathname vs basePath + /mcp.

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name stxmcp.paysats.exchange;

    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/stxmcp.paysats.exchange/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stxmcp.paysats.exchange/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /mcp {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name stxmcp.paysats.exchange;
    return 301 https://$host$request_uri;
}
