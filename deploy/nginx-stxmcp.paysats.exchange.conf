# paysats_v2 Stacks MCP reverse proxy — stxmcp.paysats.exchange
#
# Install:
#   sudo cp deploy/nginx-stxmcp.paysats.exchange.conf /etc/nginx/sites-available/paysats-v2-stxmcp
#   sudo ln -sf /etc/nginx/sites-available/paysats-v2-stxmcp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS (after DNS A record -> server is live):
#   sudo certbot --nginx -d stxmcp.paysats.exchange --redirect
#
# Same Next.js process as privymcp (pm2 paysats-v2-mcp, PORT=3400).
# Claude config:
#   { "mcpServers": { "paysats-stacks": { "url": "https://stxmcp.paysats.exchange/mcp" } } }

server {
    listen 80;
    listen [::]:80;
    server_name stxmcp.paysats.exchange;

    client_max_body_size 1m;

    location = /mcp {
        proxy_pass http://127.0.0.1:3400/api/stxmcp/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
