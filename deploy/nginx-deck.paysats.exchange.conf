# paysats_v2 pitch deck (static) — deck.paysats.exchange
#
# Serves the self-contained deck at deck/index.html as a shareable link.
# No app/pm2 needed: nginx serves the static file directly.
#
# Install:
#   sudo cp deploy/nginx-deck.paysats.exchange.conf /etc/nginx/sites-available/paysats-v2-deck
#   sudo ln -sf /etc/nginx/sites-available/paysats-v2-deck /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS (after DNS A record -> server is live):
#   sudo certbot --nginx -d deck.paysats.exchange --redirect
#
# Assumes the repo lives at /home/<user>/paysats_v2. Adjust `root` to match.

server {
    listen 80;
    listen [::]:80;
    server_name deck.paysats.exchange;

    root /home/ubuntu/paysats_v2/deck;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The deck is one file; cache lightly so updates show up quickly.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
